async function genStart(){
  const g=S.gen; const s=subjectById(g.subjectId);
  g.jobs=[...g.types].map(type=>({type,status:"queue",chars:0})); g.phase="run"; g.running=true; g.ctl=new AbortController(); renderGenerate();
  const allIds = topicsOf(s.id).filter(t=>S.files.some(f=>f.topicId===t.id)).map(t=>t.id);
  const ctxs = {};
  const getCtx = async ids => { const k=ids.slice().sort().join(","); return ctxs[k] ||= await AI.context(s, ids); };
  const days = daysUntil(g.examDate || nearestExam([...g.topicIds]));
  for (const j of g.jobs){
    if (g.ctl.signal.aborted){ j.status="error"; j.err="Cancelado."; continue; }
    j.status="work"; if (S.gen===g) renderGenerate();
    const T=TYPES[j.type];
    const ids = j.type==="global" ? allIds : [...g.topicIds];
    const count = j.type==="flashcards"?g.fcCount : j.type==="quiz"?g.qCount : null;
    try {
      const ctx = await getCtx(ids);
      const topicNames = ctx.topics.map(t=>t.name);
      const weak = j.type==="global" ? Stats.weakTopics(s.id).filter(x=>x.p<0.75).slice(0,4) : null;
      const prompt = AI.prompt(j.type, ctx.text, {diff:g.diff, notes:g.notes.trim(), examInfo:g.examInfo, examDate:g.examDate, subjectName:s.name, count, days, weak});
      let last=0;
      const onText = ({text})=>{ j.chars=text.length; if (Date.now()-last>400 && S.gen===g){ last=Date.now(); renderGenerate(); } };
      let content, truncated=false;
      if (T.kind==="json") content = AI.validate(j.type, await AI.call(prompt, {json:true, signal:g.ctl.signal, onText}));
      else { const r = await AI.call(prompt, {signal:g.ctl.signal, onText}); content=r.text; truncated=r.truncated; }
      const scope = j.type==="global" ? "toda la asignatura" : topicNames.length>2 ? `${topicNames.length} temas` : topicNames.join(" + ");
      const title = (j.type==="exam"||j.type==="global") && content.title ? content.title : `${T.label} · ${scope}`;
      j.id = await Repo.saveMaterial({subjectId:s.id, topicIds:ids, topicNames, type:j.type, title:title.slice(0,140), content, meta:{count, diff:g.diff, cut:ctx.cut, truncated, examDate:g.examDate||null, phase:AI.phase(days)?.key||null}});
      j.status="done";
    } catch(e){ j.status="error"; j.err = e?.code && !["invalid_argument","quota_exceeded"].includes(e.code) ? AI.errText(e) : dbErr(e); }
    if (S.gen===g) renderGenerate();
  }
  g.running=false;
  if (S.gen===g){ if (g.hidden) S.gen=null; else renderGenerate(); }
  const n=g.jobs.filter(j=>j.status==="done").length; if (n) toast(`${n} ${n===1?"material listo":"materiales listos"}`);
}

  const it=im.item, T=TYPES[it.type]||{label:it.type,icon:"notes",color:"blue"};
  openSheet(`${sheetHead("Importar material")}

async function importLookup(){
  const im=S.imp; const raw=$("#imp-code").value.trim(); im.code=raw;
  const k=raw.lastIndexOf("~"); const owner=raw.slice(0,k), code=raw.slice(k+1);
  const ok=/^[A-Za-z0-9_\-.:@+]{3,200}$/;
  if (k<1 || !ok.test(owner) || !ok.test(code)){ im.err="Ese código no es válido. Cópialo entero, tal cual te lo pasaron."; renderImport(); return; }
  im.busy=true; im.err=null; renderImport();
  try {
    const snap=await S.db.doc(`shared/${owner}/items/${code}`).get();
    if (S.imp!==im) return;
    im.busy=false;
    if (!snap.exists){ im.err="No encuentro ese material. Puede que lo hayan dejado de compartir."; renderImport(); return; }
    const d=snap.data(); if (!TYPES[d.type] || !d.content){ im.err="Ese material no se puede importar."; renderImport(); return; }
    im.item=d; im.phase="confirm"; renderImport();
  } catch { if (S.imp===im){ im.busy=false; im.err="No se pudo buscar el código. Revisa la conexión."; renderImport(); } }
}
async function importSave(){
  const im=S.imp, it=im.item; if (!im.subjectId) return;
  im.busy=true; renderImport();
  try {
    const content = AI.validate(it.type, JSON.parse(JSON.stringify(it.content)));
    await Repo.saveMaterial({subjectId:im.subjectId, topicIds:[], topicNames:[], type:it.type, title:String(it.title||TYPES[it.type].label).slice(0,140), content, meta:{sharedBy:String(it.from||"un compañero").slice(0,40)}});
    const sid=im.subjectId; closeSheet(); toast("Material importado"); go({name:"subject", id:sid, tab:"materials"});
  } catch(e){ im.busy=false; toast(e?.code==="invalid_json"?"Ese material está dañado y no se puede importar.":dbErr(e)); renderImport(); }
}

    return;
  }
  const m=S.materials.find(x=>x.id===id); if(!m) return;
  const s=subjectById(m.subjectId); const T=TYPES[m.type];

  let body="";
  if (T.kind==="md") body = `${note}<article class="doc"><div class="md">${md(m.content)}</div></article>`;

  if (m.type==="quiz") quizInit();

/* Flashcards (material o repaso diario) con repaso espaciado */
function fcStart(decks, queue, label, mid){ S.viewer.fc={decks, queue:shuffle(queue), pos:0, flipped:false, label, mid, done:0, requeued:new Set()}; fcRender(); }
async function openDailyReview(){
  const ids=Object.keys(S.srs).filter(k=>SRS.dueIdx(k).length);
  if (!ids.length){ toast("No te toca ninguna tarjeta hoy."); return; }
  S.viewer={kind:"review"};
  showViewer({eyebrow:"Repaso de hoy", title:"Flashcards que te tocan", actions:"", body:`<div id="fc-body" style="display:flex;flex-direction:column;gap:16px"><p class="muted"><span class="spin"></span> Preparando tus tarjetas…</p></div>`});
  try {
    const snaps=await Promise.all(ids.map(id=>Repo.col("materials").doc(id).get()));
    const decks={}, queue=[];
    snaps.forEach((sn,k)=>{ if(!sn.exists) return; const m=sn.data(); const cards=m.content?.cards||[]; decks[ids[k]]={title:m.title, cards, subjectId:m.subjectId}; SRS.dueIdx(ids[k]).filter(i=>i<cards.length).forEach(i=>queue.push({mid:ids[k],i})); });
    if (S.viewer?.kind!=="review") return;
    fcStart(decks, queue.slice(0,80), "Repaso de hoy", null);
  } catch { const el=$("#fc-body"); if(el) el.innerHTML=`<div class="notice bad">No se pudieron cargar las tarjetas. Revisa la conexión.</div>`; }
}
function fcRender(){
  const fc=S.viewer?.fc, el=$("#fc-body"); if(!fc||!el) return;
  const multi=Object.keys(fc.decks).length>1;
  const deckStats = fc.mid ? SRS.counts(fc.mid) : null;
  const meter = deckStats ? `<div class="meter" aria-label="${deckStats.mastered} dominadas de ${deckStats.total}"><i style="width:${deckStats.mastered/deckStats.total*100}%"></i><i class="l" style="width:${deckStats.learning/deckStats.total*100}%"></i></div>` : `<div class="meter"><i style="width:${fc.pos/Math.max(1,fc.queue.length)*100}%;background:var(--pen)"></i></div>`;
  if (fc.pos>=fc.queue.length){
    const due=fc.mid?SRS.dueIdx(fc.mid).length:SRS.totalDue();
    el.innerHTML=`<div class="q-card" style="align-items:flex-start"><span class="eyebrow">${esc(fc.label)} · terminado</span><div class="score-big">${fc.done}<span class="muted" style="font-size:1.4rem"> tarjetas repasadas</span></div>
      ${deckStats?`<p class="muted">${deckStats.mastered} dominadas · ${deckStats.learning} aprendiendo · ${deckStats.fresh} nuevas</p>`:""}
      <p class="hand" style="font-size:1.5rem">${due?`Aún te quedan ${due} para hoy`:"¡Al día! Las siguientes vuelven cuando toque."}</p>
      <div class="row">${fc.mid?`<button class="btn" data-action="fc-all">Repasar todas igualmente</button>`:""}<button class="btn primary" data-action="close-viewer">Terminar</button></div></div>`;
    return;
  }
  const it=fc.queue[fc.pos], deck=fc.decks[it.mid], c=deck.cards[it.i], st=S.srs[it.mid]?.cards?.[it.i];
  const nextKnown = BOX_DAYS[Math.min((st?.b||0)+1, BOX_DAYS.length-1)];
  el.innerHTML=`<div class="fc-top"><span class="small muted">${esc(fc.label)} · ${fc.pos+1} de ${fc.queue.length}</span>${meter}</div>
    ${deckStats?`<div class="legend"><span style="--c:var(--ok)">${deckStats.mastered} dominadas</span><span style="--c:var(--marker)">${deckStats.learning} aprendiendo</span><span style="--c:var(--rule)">${deckStats.fresh} nuevas</span></div>`:""}
    <button class="fc ${fc.flipped?"back":""}" data-action="fc-flip" aria-live="polite">${multi||c.tag?`<span class="tag">${esc(multi?deck.title:c.tag)}</span>`:""}<span class="face">${esc(fc.flipped?c.a:c.q)}</span><span class="hint">${fc.flipped?"¿Te la sabías?":"Toca o pulsa espacio para ver la respuesta"}</span></button>
    <div class="fc-ctrl"><button class="btn badb" data-action="fc-mark" data-v="0">${ic("x")}No me la sé<small>vuelve hoy</small></button><button class="btn okb" data-action="fc-mark" data-v="1">${ic("check")}Me la sé<small>vuelve ${nextKnown===1?"mañana":`en ${nextKnown} días`}</small></button></div>`;
}
function fcMark(known){
  const fc=S.viewer.fc, it=fc.queue[fc.pos];
  if (!SRS.mark(it.mid, it.i, known)) { toast("No se encuentra el progreso de este mazo."); }
  fc.done++;
  const key=`${it.mid}:${it.i}`;
  if (!known && !fc.requeued.has(key)){ fc.requeued.add(key); fc.queue.push(it); }
  fc.pos++; fc.flipped=false; fcRender();
}

/* Quiz viewer */
function quizInit(only){ const qs=S.viewer.m.content.questions; S.viewer.q={order: only||shuffle(qs.map((_,i)=>i)), pos:0, picks:{}, done:false}; quizRender(); }
function quizRender(){
  const v=S.viewer, qs=v.m.content.questions, st=v.q, el=$("#q-body"); if(!el) return;
  if (st.done){
    const wrong=st.order.filter(i=>st.picks[i]!==qs[i].answer), score=st.order.length-wrong.length;
    el.innerHTML=`<div class="q-card" style="align-items:flex-start"><span class="eyebrow">Resultado</span><div class="score-big">${score}<span class="muted" style="font-size:1.4rem"> / ${st.order.length}</span></div><p class="hand" style="font-size:1.6rem">${score/st.order.length>=0.9?"¡Lo bordas!":score/st.order.length>=0.6?"Vas bien, repasa los fallos":"Toca repasar este tema"}</p>
      <div class="row">${wrong.length?`<button class="btn primary" data-action="q-wrong">Repetir las ${wrong.length} falladas</button>`:""}<button class="btn" data-action="q-again">Repetir todo</button></div></div>
      ${wrong.length?`<h3>Repasa estas</h3><ul class="review">${wrong.map(i=>`<li><b>${esc(qs[i].q)}</b><span style="color:var(--ok)">✓ ${esc(qs[i].options[qs[i].answer])}</span>${st.picks[i]!=null?`<span style="color:var(--bad)">✗ Marcaste: ${esc(qs[i].options[st.picks[i]])}</span>`:""}${qs[i].explain?`<span class="small muted">${esc(qs[i].explain)}</span>`:""}</li>`).join("")}</ul>`:""}`;
    return;
  }
  const i=st.order[st.pos], q=qs[i], picked=st.picks[i];
  el.innerHTML=`<div class="fc-top"><span class="small muted">Pregunta ${st.pos+1} de ${st.order.length}</span><div class="meter"><i style="width:${st.pos/st.order.length*100}%;background:var(--pen)"></i></div></div>
    <div class="q-card">${q.tag?`<span class="eyebrow">${esc(q.tag)}</span>`:""}<div class="q-text">${esc(q.q)}</div>
      <div class="opts">${q.options.map((o,k)=>`<button class="opt ${picked!=null&&k===q.answer?"right":""} ${picked===k&&k!==q.answer?"wrong":""}" data-action="q-pick" data-k="${k}" ${picked!=null?"disabled":""}><span class="k">${"ABCDEF"[k]}</span><span>${esc(o)}</span></button>`).join("")}</div>
      ${picked!=null?`${q.explain?`<div class="explain">${picked===q.answer?"<b>¡Bien!</b> ":"<b>No es esa.</b> "}${esc(q.explain)}</div>`:""}<div class="row" style="justify-content:flex-end"><button class="btn primary" data-action="q-next">${st.pos+1<st.order.length?"Siguiente":"Ver resultado"}</button></div>`:""}
    </div>`;
}
async function quizFinish(){
  const v=S.viewer, qs=v.m.content.questions, st=v.q; st.done=true; quizRender();
  const score=st.order.filter(i=>st.picks[i]===qs[i].answer).length;
  const attempts=[...(v.m.attempts||[]), {at:nowISO(), score, total:st.order.length}].slice(-20); v.m.attempts=attempts;
  try { await Repo.col("materials").doc(v.m.id).update({attempts}); } catch(e){ toast(dbErr(e)); }
  await Stats.addResult({kind:"quiz", sid:v.m.subjectId, tids:v.m.topicIds||[], score, total:st.order.length, title:v.m.title});
}

function pdfHtml(m, withSol){
  const s=subjectById(m.subjectId), c=m.content;
  const head=`<div class="pdf-head"><span>${esc(APP)} · ${esc(s?.name||"")}</span><span>${esc(fmtDate(m.createdAt,{day:"numeric",month:"long",year:"numeric"}))}</span></div><h1>${esc(m.title)}</h1>`;
  if (TYPES[m.type].kind==="md") return head+md(c);
  if (m.type==="exam"||m.type==="global") return head+`<p><b>Tiempo:</b> ${esc(c.minutes)} minutos · <b>Nombre:</b> ______________________</p>`+md(c.exam_md)+(withSol?`<div class="brk"></div><h1>Soluciones</h1>${md(c.solutions_md)}`:"");
  if (m.type==="flashcards") return head+`<p>Recorta por la línea discontinua y dobla por la mitad: pregunta delante, respuesta detrás.</p><table class="cut">${c.cards.map(k=>`<tr><td><b>${esc(k.q)}</b></td><td>${esc(k.a)}</td></tr>`).join("")}</table>`;
  if (m.type==="quiz") return head+c.questions.map((q,i)=>`<p><b>${i+1}. ${esc(q.q)}</b></p>${q.options.map((o,k)=>`<p class="opt-l">${"abcdef"[k]}) ${esc(o)}</p>`).join("")}`).join("")+`<div class="brk"></div><h2>Soluciones</h2><p>${c.questions.map((q,i)=>`${i+1}-${"abcdef"[q.answer]}`).join(" · ")}</p>`;
  if (m.type==="mindmap"){ const ul=ch=>ch?.length?`<ul>${ch.map(n=>`<li>${esc(n.title)}${ul(n.children)}</li>`).join("")}</ul>`:""; return head+`<h2>${esc(c.center)}</h2>`+c.branches.map(b=>`<h3>${esc(b.title)}</h3>${ul(b.children)}`).join(""); }
  return head;
}
async function exportPdf(btn, withSol, custom){
  const m=custom || S.viewer?.m; if(!m||!S.downloads) return;
  const label=btn.innerHTML; btn.disabled=true; btn.innerHTML=`<span class="spin"></span> Creando PDF`;
  try {
    await loadLib("html2pdf");
    const el=document.createElement("div"); el.className="pdf-doc"; el.innerHTML=m.html || pdfHtml(m, withSol);
    const blob = await html2pdf().set({margin:[14,14,16,14], image:{type:"jpeg",quality:0.95}, html2canvas:{scale:2, backgroundColor:getComputedStyle(document.documentElement).getPropertyValue("--print-bg").trim()||null}, jsPDF:{unit:"mm",format:"a4",orientation:"portrait"}, pagebreak:{mode:["css","legacy"], avoid:["h2","h3","li","tr","p","blockquote"]}}).from(el).outputPdf("blob");

  "subject-delete": async()=>{ const s=subjectById(S.view.id); if(await confirmBox(`¿Borrar ${s.name}?`,"Se borran todos sus temas, archivos y materiales.")){ toast("Borrando…"); try{ await Repo.deleteSubject(s); go({name:"home"}); toast("Asignatura borrada"); }catch(e){ toast(dbErr(e)); } } },

  "topic-delete": async()=>{ const t=S.topics.find(x=>x.id===S.menuTopic); if(await confirmBox(`¿Borrar ${t.name}?`,"Se borran sus archivos. El material ya creado se queda en Material.")){ try{ await Repo.deleteTopic(t); toast("Tema borrado"); }catch(e){ toast(dbErr(e)); } } },

    openSheet(`${sheetHead(f.name, `${esc(f.kind)} · ${nf(f.chars)} caracteres`)}<div class="field"><label for="mv-topic">Mover a otro tema</label><select class="input" id="mv-topic" data-change="file-move">${ts.map(t=>`<option value="${t.id}" ${t.id===f.topicId?"selected":""}>${esc(t.name)}</option>`).join("")}</select></div><div class="row"><button class="btn" data-action="open-file" data-id="${f.id}">Ver texto extraído</button><button class="btn danger" data-action="file-delete">${ic("trash")}Borrar archivo</button></div>`); },
  "file-delete": async()=>{ const f=S.files.find(x=>x.id===S.menuFile); if(await confirmBox(`¿Borrar ${f.name}?`,"Se borra el archivo de este tema.")){ try{ await Repo.deleteFile(f); toast("Archivo borrado"); }catch(e){ toast(dbErr(e)); } } },
  "mat-filter": el=>{ S.matFilter=el.dataset.f; refresh(); },
  "open-material": el=>{ if ($("#sheet-root").innerHTML) closeSheet(); openViewer("material", el.dataset.id); },

  "del-material": async()=>{ const m=S.viewer.m; if(await confirmBox("¿Borrar este material?", m.title)){ try{ await Repo.deleteMaterial(m); Sim.save(m.id,null); closeViewer(); toast("Material borrado"); }catch(e){ toast(dbErr(e)); } } },

  "sim-start": ()=>{ const m=S.viewer.m; Sim.save(m.id,{endsAt:Date.now()+m.content.minutes*60e3, answers:"", done:false}); S.viewer.simPhotos=[]; Stats.activity(2); examTab("sim"); },
  "sim-finish": simFinish,

  "sim-reset": ()=>{ Sim.save(S.viewer.m.id,null); examTab("sim"); },

  "up-remove": el=>{ S.up.items.splice(+el.dataset.i,1); renderUpload(); },
  "up-start": upStart,

  "gen-topic": el=>{ const g=S.gen, id=el.dataset.id; g.topicIds.has(id)?g.topicIds.delete(id):g.topicIds.add(id); if(!g.examDate) g.examDate=nearestExam([...g.topicIds]); renderGenerate(); },
  "gen-type": el=>{ const g=S.gen, t=el.dataset.t; g.types.has(t)?g.types.delete(t):g.types.add(t); g.approach=Object.entries(APPROACHES).find(([,a])=>a.types.length===g.types.size&&a.types.every(x=>g.types.has(x)))?.[0]||null; renderGenerate(); },
  "gen-start": genStart,
  "gen-stop": ()=>S.gen?.ctl?.abort(),

document.addEventListener("click", e=>{
  const el=e.target.closest("[data-action]"); if(!el || el.disabled) return;
  const fn=ACTIONS[el.dataset.action]; if(!fn) return;
  if (el.dataset.action!=="sheet-bg") e.preventDefault();
  fn(el, e);
});
const CHANGES = {
  "up-subject": el=>{ const u=S.up; u.subjectId=el.value; u.mode="auto"; u.topicId=""; renderUpload(); },
  "up-mode": el=>{ const u=S.up, v=el.value; if(v.startsWith("t:")){ u.mode="topic"; u.topicId=v.slice(2); } else u.mode=v; renderUpload(); },
  "up-files": el=>addUploadFiles(el.files),
  "up-assign": el=>{ S.up.assign[+el.dataset.i]=el.value; },
  "gen-opt": el=>{ const k=el.dataset.k; S.gen[k] = ["fcCount","qCount"].includes(k) ? +el.value : el.value; renderGenerate(); },
  "file-move": async el=>{ try{ await Repo.col("files").doc(S.menuFile).update({topicId:el.value}); closeSheet(); toast("Archivo movido"); }catch(e){ toast(dbErr(e)); } },
  "imp-subject": el=>{ S.imp.subjectId=el.value; },
  "tk-files": el=>{ taskAttach(el.files); },
  "sim-photos": el=>{ const max=S.limits?.images?.maxCount||1; const fs=[...el.files].slice(0,max); S.viewer.simPhotos=fs; const n=$("#sim-photos-n"); if(n) n.textContent=`${fs.length} ${fs.length===1?"foto lista":"fotos listas"}${el.files.length>max?` (máximo ${max})`:""}`; },
};
document.addEventListener("change", e=>{
  const t=e.target;
  if (t.dataset?.pfc==="course"){ const p=S.pf; p.course=t.value; if (p.ctx==="signup"){ p.picks=new Set(DEFAULT_PICKS[p.course]||[]); p.suggested=[]; } rerenderPf(); return; }
  if (t.dataset?.tkf && S.tk){ S.tk[t.dataset.tkf]=t.value; if (["type","due"].includes(t.dataset.tkf)) { readTaskForm(); renderTaskSheet(); } return; }
  if (t.dataset?.pfhome && S.pf){ S.pf.prefs.home={...S.pf.prefs.home, [t.dataset.pfhome]:t.checked}; return; }
  if (t.dataset?.pfpref && S.pf){ S.pf.prefs[t.dataset.pfpref]=t.checked; return; }
  if (t.dataset?.pfnum && S.pf){ S.pf.prefs[t.dataset.pfnum]=Number(t.value); return; }
  if (t.dataset?.exf && S.ex){ S.ex[t.dataset.exf]=t.value; if (["subjectId","kind","date"].includes(t.dataset.exf)){ if(t.dataset.exf==="subjectId") S.ex.topicIds=new Set(); renderExamSheet(); } return; }
  if (t.dataset?.pfb){ S.pf[t.dataset.pfb]=t.checked; return; }
  if (t.dataset?.pf){ setPf(t.dataset.pf, t.value); return; }
  const el=t.closest("[data-change]"); if(el) CHANGES[el.dataset.change]?.(el);
});
function setPf(path, v){ const p=S.pf; if(!p) return; const [a,b]=path.split("."); if (b) p[a]={...p[a], [b]:v}; else p[a]=v; }
let simSaveT=null;
document.addEventListener("input", e=>{
  const t=e.target;
  if (t.dataset?.pf){ setPf(t.dataset.pf, t.value); return; }
  if (t.dataset?.tkf && S.tk){ S.tk[t.dataset.tkf]=t.value; return; }
  if (t.dataset?.exf && S.ex && !["subjectId","kind","date"].includes(t.dataset.exf)){ S.ex[t.dataset.exf]=t.value; return; }
  const k=t.dataset?.input; if(!k) return;
  if (k==="up-new"){ S.up.newName=t.value; const b=$("[data-action=up-start]"); if(b) b.disabled=!S.up.items.length||!S.up.newName.trim(); }
  if (k==="up-date") S.up.examDate=t.value;
  if (k==="gen-notes") S.gen.notes=t.value;
  if (k==="sim-ans"){ clearTimeout(simSaveT); simSaveT=setTimeout(()=>{ const m=S.viewer?.m; const s=m&&Sim.get(m.id); if(s){ s.answers=t.value; Sim.save(m.id,s); } }, 400); }
});
function addUploadFiles(list){ if(!S.up) return; for (const f of list) S.up.items.push({file:f, status:"queue"}); renderUpload(); }
document.addEventListener("dragover", e=>{ const d=e.target.closest?.("#up-drop"); if(d){ e.preventDefault(); d.classList.add("over"); } });
document.addEventListener("dragleave", e=>{ const d=e.target.closest?.("#up-drop"); if(d) d.classList.remove("over"); });
document.addEventListener("drop", e=>{ const d=e.target.closest?.("#up-drop"); if(d){ e.preventDefault(); addUploadFiles(e.dataTransfer.files); } });
document.addEventListener("submit", async e=>{
  e.preventDefault();
  const f=e.target;
  if (f.id==="signup") signupNext(f);
  if (f.id==="settings-form"){
    const p=S.pf; p.name=$("#pf-name").value;
    if (isSchool(p.course) && !p.region){ toast("Elige tu comunidad autónoma."); return; }
    const data=pfToProfile(p); if(!data.name) data.name=S.profile.name;
    try { await Repo.profileRef().set({...S.profile, ...data, ...(p.course!=="Universidad"?{uni:null}:{}), ...(isSchool(p.course)?{}:{region:null}), ...(p.course==="2º Bachillerato"?{}:{pau:null})}); S.pf=null; closeSheet(); applyPrefs(); toast("Cambios guardados"); } catch(err){ toast(dbErr(err)); }
  }
  if (f.id==="exam-form") saveExamForm();
  if (f.id==="task-form") saveTaskForm();
  if (f.id==="quick-task"){ const title=$("#qt-title").value.trim(); if(!title){ $("#qt-title").focus(); return; } const subjectId=S.view.name==="subject"?S.view.id:($("#qt-subject")?.value||null); const due=$("#qt-due").value||null;
    try { await Repo.saveTask(null,{title:title.slice(0,120), subjectId, type:"Deberes", due, time:null, notes:""}); $("#qt-title").value=""; $("#qt-due").value=""; toast("Tarea añadida"); } catch(err){ toast(dbErr(err)); } }
  if (f.id==="grade-form"){ const x=S.ex; const g=Number(String(x?.grade??"").replace(",",".")), mx=+x?.max||10; if (!x||x.grade===""||x.grade==null||isNaN(g)||g<0||g>mx){ toast("Escribe una nota válida."); return; }
    try { await Repo.saveExam(x.id,{grade:g, max:mx}); await Stats.addResult({kind:"real", sid:x.subjectId, tids:[...x.topicIds], score:g, total:mx, title:examName(x)}); closeSheet(); toast("Nota guardada"); } catch(e){ toast(dbErr(e)); } }
  if (f.id==="prompt-form"){ const v=$("#pb-input").value.trim(); const r=promptBox.res; promptBox.res=null; closeSheet(); r?.(v||null); }
  if (f.id==="chat-form") S.chat?.busy ? S.chat.ctl?.abort() : sendChat();
  if (f.id==="fix-form") examFix();
  if (f.id==="import-form" && !S.imp?.busy) importLookup();
});
document.addEventListener("keydown", e=>{
  if (e.key==="Escape"){ if ($("#sheet-root").innerHTML){ if(!(S.up&&S.up.phase==="saving")) closeSheet(); } else if (S.viewer) closeViewer(); return; }
  if (e.target.closest?.("input,textarea,select")) {
    if (e.target.id==="chat-input" && e.key==="Enter" && !e.shiftKey){ e.preventDefault(); if(!S.chat?.busy) sendChat(); }
    if (e.target.id==="pf-custom" && e.key==="Enter"){ e.preventDefault(); ACTIONS["pf-add"](); }
    if (e.target.id==="tk-item" && e.key==="Enter"){ e.preventDefault(); ACTIONS["tk-add-item"](); }
    return;
  }
  const fc=S.viewer?.fc;
  if (fc && $("#fc-body") && fc.pos<fc.queue.length && !$("#sheet-root").innerHTML){
    if (e.key===" " && !e.target.closest?.("button")){ e.preventDefault(); ACTIONS["fc-flip"](); }
    if (e.key==="ArrowRight") fcMark(true);
    if (e.key==="ArrowLeft") fcMark(false);
  }
});
window.addEventListener("pagehide", ()=>{ SRS.flush(); Stats.flush(); });

/* Chat */
async function sendChat(){
  const c=S.chat, input=$("#chat-input"); if(!c||c.busy||!input) return;
  const q=input.value.trim(); if(!q) return;
  if (!S.sample){ toast("Para preguntar hace falta permitir que esta página use Claude."); return; }
  if (!c.topicIds.size){ toast("Marca al menos un tema."); return; }
  input.value=""; const s=subjectById(c.subjectId);
  c.turns.push({role:"user",content:q}); const ans={role:"assistant",content:""}; c.turns.push(ans);
  c.busy=true; c.ctl=new AbortController(); paintChat();
  try {
    const ctx=await AI.context(s,[...c.topicIds]);
    const rules=`${AI.level()}\n${AI.style()}\n\nEres el profesor particular de ${S.profile?.name||"la alumna"} de ${s.name}. Responde en español de España, claro, cercano y breve, con ejemplos y en Markdown cuando ayude. Básate en el material; si algo no está en él, dilo y explica lo general marcándolo como "(ampliación)". Si te pide preguntas de repaso, házselas de una en una y corrige sus respuestas.\n\n${ctx.text}`;
    const turns=c.turns.slice(0,-1).slice(-12);
    let last=0;
    await AI.call([{role:"user",content:rules},...turns], {signal:c.ctl.signal, onText:({text})=>{ ans.content=text; if(Date.now()-last>120){ last=Date.now(); paintChat(); } }});
    Stats.activity(1);
  } catch(e){ if (!ans.content) ans.content = e?.code==="cancelled" ? "_(Parado)_" : `_${AI.errText(e)}_`; else if (e?.code!=="cancelled") ans.content += `\n\n_${AI.errText(e)}_`; }
  c.busy=false; c.ctl=null; paintChat();
}
function paintChat(){
  const log=$("#r-chat-log"); if(log) log.innerHTML=chatLog();
  const b=$("#chat-send"); if(b) b.innerHTML=S.chat.busy?ic("stop")+"Parar":"Enviar";
  log?.lastElementChild?.scrollIntoView({block:"end", behavior:"smooth"});
}

/* ── Boot ──────────────────────────────────────────────────────────── */
function enterApp(){
  S.authNotice=null; Repo.subscribeApp();
  const last=local.get("repaso.last");
  go(last ? {name:"subject", id:last, tab:"topics"} : {name:"home"});
}
(async()=>{
  await usePlatform();
  if (!S.db || !S.uid){ S.view={name:"auth"}; render(); return; }
  let first=true;
  const decide = () => { first=false; if (S.profile && Auth.hasSession()) enterApp(); else { S.view={name:"auth"}; render(); } };
  const fallback = setTimeout(()=>{ if (first) decide(); }, 8000);
  Repo.profileRef().onSnapshot(snap=>{
    S.profile = snap.exists ? snap.data() : null;
    if (!(S.pf && (S.pf.ctx==="settings" || S.pf.ctx==="signup"))) applyPrefs();
    // Un "no existe" sacado de caché no es definitivo: esperamos al servidor antes de mandar a crear cuenta.
    if (first){ if (!snap.exists && snap.metadata?.fromCache) return; clearTimeout(fallback); decide(); return; }
    if (S.view.name==="auth") render();
    else if (!S.profile){ Repo.unsubscribeAll(); Auth.signOut(); S.authTab="signup"; go({name:"auth"}); }
    else refresh();
  }, ()=>{ S.view={name:"auth"}; S.authNotice="No se pudo conectar con tu cuenta. Recarga la página."; render(); });
})();
